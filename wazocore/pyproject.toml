[project]
name = "wazocore"
version = "0.1.0"
description = "WazoCore: in-place vocabulary expansion for N-ATLaS (Yoruba, Hausa, Igbo)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["tokenizers>=0.20"]

[dependency-groups]
dev = ["pytest>=8"]
ref = ["torch>=2.4", "transformers>=5.0", "safetensors>=0.4", "numpy>=1.26"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
