[package]
name = "atlas-convert"
version = "0.1.0"
description = "Convert bf16 safetensors checkpoints to the sparse-friendly .satl weight format"
edition.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
half = "2"
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
