[package]
name = "atlas-sim"
version = "0.1.0"
description = "Trace-driven cache simulator for streaming N-ATLAS MLP weights from storage"
edition.workspace = true
publish.workspace = true

[dependencies]
atlas-probe = { path = "../atlas-probe" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
