[package]
name = "atlas-rt"
version = "0.1.0"
description = "N-ATLAS CPU runtime: .satl loader, input-sparse kernels, Llama-3 forward pass"
edition.workspace = true
publish.workspace = true

[dependencies]
atlas-satl = { path = "../atlas-satl" }
clap = { version = "4", features = ["derive"] }
half = "2"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
